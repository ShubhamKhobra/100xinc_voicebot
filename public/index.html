<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voicebot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eaeff1;
    --panel: #f8fafb;
    --ink: #10303a;
    --muted: #5d7680;
    --line: #cdd9de;
    --listen: #d9462b;
    --speak: #1f7a6d;
    --think: #10303a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
  }
  main {
    width: 100%; max-width: 560px; min-height: 100vh;
    padding: 40px 20px 28px;
    display: flex; flex-direction: column;
  }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }

  .stage {
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 0 24px;
  }
  .orb-wrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--ink); opacity: .18;
    transform: scale(calc(.62 + var(--level, 0) * .38));
    transition: transform 70ms linear, border-color .2s, opacity .2s;
  }
  .ring.r2 { inset: 14px; opacity: .12; transform: scale(calc(.7 + var(--level, 0) * .3)); }

  #orb {
    position: relative; width: 118px; height: 118px; border-radius: 50%;
    border: 0; cursor: pointer; color: #fff; background: var(--ink);
    display: grid; place-items: center;
    transition: background .2s, transform .15s;
  }
  #orb:active { transform: scale(.96); }
  #orb:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
  #orb svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #orb .i-stop, #orb .i-wave { display: none; }

  body[data-state="listening"] #orb { background: var(--listen); }
  body[data-state="listening"] .ring { border-color: var(--listen); opacity: .55; }
  body[data-state="listening"] .i-mic { display: none; }
  body[data-state="listening"] .i-stop { display: block; }

  body[data-state="thinking"] #orb { background: var(--think); cursor: progress; }
  body[data-state="thinking"] .ring { animation: breathe 1.4s ease-in-out infinite; }

  body[data-state="speaking"] #orb { background: var(--speak); }
  body[data-state="speaking"] .ring { border-color: var(--speak); animation: speak 0.9s ease-in-out infinite; opacity: .5; }
  body[data-state="speaking"] .ring.r2 { animation-delay: .22s; }
  body[data-state="speaking"] .i-mic { display: none; }
  body[data-state="speaking"] .i-wave { display: block; }

  @keyframes breathe { 50% { transform: scale(.9); opacity: .3; } }
  @keyframes speak { 0%, 100% { transform: scale(.74); } 50% { transform: scale(.98); } }

  #status { margin: 18px 0 0; font-size: 1.05rem; font-weight: 600; text-align: center; min-height: 1.5em; }
  #hint { margin: 4px 0 0; color: var(--muted); font-size: .9rem; text-align: center; min-height: 1.3em; }
  #hint.error { color: var(--listen); }

  .log {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 6px 18px; overflow-y: auto;
    max-height: 42vh; min-height: 120px;
  }
  .log:empty::before {
    content: "Your conversation will appear here.";
    display: block; padding: 18px 0; color: var(--muted); font-size: .92rem;
  }
  .msg { padding: 12px 0; border-bottom: 1px solid var(--line); line-height: 1.45; max-width: 68ch; }
  .msg:last-child { border-bottom: 0; }
  .msg b { display: block; font-size: .8rem; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .msg.bot b { color: var(--speak); }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: .85rem; color: var(--muted); }
  .foot button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .foot button:hover { background: var(--panel); }
  .foot button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .ring { animation: none !important; } }
</style>
</head>
<body data-state="idle">
<main>
  <h1>Voicebot</h1>

  <section class="stage" aria-live="polite">
    <div class="orb-wrap" id="orbWrap">
      <div class="ring"></div><div class="ring r2"></div>
      <button id="orb" aria-label="Start talking">
        <svg class="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        <svg class="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
      </button>
    </div>
    <p id="status">Tap to talk</p>
    <p id="hint">Stops listening when you pause.</p>
  </section>

  <section class="log" id="log" aria-label="Conversation"></section>

  <div class="foot">
    <!-- <span>whisper · gpt-4o-mini · deepgram</span> -->
    <button id="clear" type="button">Clear chat</button>
  </div>
</main>

<script>
(() => {
  const API = "/api/voice";
  const SILENCE_MS = 1400;       // stop after this much quiet once you've spoken
  const NO_SPEECH_MS = 8000;     // give up if nothing is said
  const MAX_RECORD_MS = 60000;
  const SPEECH_RMS = 0.02;       // volume threshold that counts as speech

  const $ = (id) => document.getElementById(id);
  const orb = $("orb"), wrap = $("orbWrap"), statusEl = $("status"), hintEl = $("hint"), logEl = $("log");

  let state = "idle";
  let history = [];
  let stream, recorder, chunks, audioCtx, analyser, raf;
  let cancelled = false;

  // One persistent <audio> element, unlocked on the first tap so mobile Safari allows playback later.
  const player = new Audio();
  let unlocked = false;
  const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
  function unlockAudio() {
    if (unlocked) return;
    unlocked = true;
    player.src = SILENT_WAV;
    player.play().catch(() => {});
  }

  function setState(next, status, hint = "", isError = false) {
    state = next;
    document.body.dataset.state = next;
    statusEl.textContent = status;
    hintEl.textContent = hint;
    hintEl.classList.toggle("error", isError);
    orb.setAttribute("aria-label",
      next === "listening" ? "Stop and send" :
      next === "speaking" ? "Interrupt and talk" :
      next === "thinking" ? "Working" : "Start talking");
    if (next !== "listening") wrap.style.setProperty("--level", 0);
  }

  function addMessage(role, text) {
    const d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "user" : "bot");
    const b = document.createElement("b");
    b.textContent = role === "user" ? "You" : "Bot";
    const p = document.createElement("span");
    p.textContent = text;
    d.append(b, p);
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function pickMime() {
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  }

  async function startListening() {
    cancelled = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (e) {
      setState("idle", "Microphone blocked", "Allow microphone access in your browser, then tap again.", true);
      return;
    }

    const mime = pickMime();
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = onRecorded;
    recorder.start();

    // Level meter + silence detection
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);

    const t0 = performance.now();
    let heardSpeech = false, lastVoice = t0;

    const tick = () => {
      analyser.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      wrap.style.setProperty("--level", Math.min(1, rms * 9).toFixed(3));

      const now = performance.now();
      if (rms > SPEECH_RMS) { heardSpeech = true; lastVoice = now; }

      if (heardSpeech && now - lastVoice > SILENCE_MS) return stopListening();
      if (!heardSpeech && now - t0 > NO_SPEECH_MS) { cancelled = true; return stopListening(); }
      if (now - t0 > MAX_RECORD_MS) return stopListening();
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    setState("listening", "Listening…", "Tap again to send now.");
  }

  function stopListening() {
    cancelAnimationFrame(raf);
    if (recorder && recorder.state !== "inactive") recorder.stop();
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (audioCtx) audioCtx.close().catch(() => {});
  }

  async function onRecorded() {
    if (cancelled) return setState("idle", "Tap to talk", "Didn't hear anything.");
    const type = recorder.mimeType || "audio/webm";
    const blob = new Blob(chunks, { type });
    if (blob.size < 1500) return setState("idle", "Tap to talk", "That was too short.");

    setState("thinking", "Thinking…", "");
    const form = new FormData();
    form.append("audio", blob, "recording");
    form.append("history", JSON.stringify(history));

    try {
      const res = await fetch(API, { method: "POST", body: form });
      if (!res.ok) {
        let detail = res.statusText;
        try { detail = (await res.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      const data = await res.json();
      if (!data.user_text) return setState("idle", "Tap to talk", "Couldn't make out any speech.");

      addMessage("user", data.user_text);
      addMessage("bot", data.reply_text);
      history.push({ role: "user", content: data.user_text }, { role: "assistant", content: data.reply_text });
      history = history.slice(-12);

      await speak(data.audio);
    } catch (e) {
      setState("idle", "Something went wrong", String(e.message || e), true);
    }
  }

  function speak(b64) {
    return new Promise((resolve) => {
      setState("speaking", "Speaking…", "Tap to interrupt.");
      const done = () => {
        player.onended = player.onerror = null;
        if (state === "speaking") setState("idle", "Tap to talk", "");
        resolve();
      };
      player.onended = done;
      player.onerror = done;
      player.src = "data:audio/mpeg;base64," + b64;
      player.play().catch(() => {
        setState("idle", "Tap to talk", "Couldn't play audio. Check your speaker or browser permissions.", true);
        resolve();
      });
    });
  }

  function interruptSpeech() {
    player.pause();
    player.onended = player.onerror = null;
  }

  orb.addEventListener("click", () => {
    unlockAudio();
    if (state === "idle") startListening();
    else if (state === "listening") stopListening();
    else if (state === "speaking") { interruptSpeech(); startListening(); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); orb.click(); }
  });

  $("clear").addEventListener("click", () => {
    history = [];
    logEl.textContent = "";
    if (state === "speaking") { interruptSpeech(); setState("idle", "Tap to talk", ""); }
  });

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setState("idle", "Not supported", "This browser can't record audio. Try Chrome, Edge, Firefox or Safari 14.1+.", true);
    orb.disabled = true;
  }
})();
</script>
</body>
</html>
